spring.application.name=keyboard-mes

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:keyboard_mes}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=10000ms
spring.cache.type=redis
app.redis.startup-wait.enabled=${REDIS_STARTUP_WAIT_ENABLED:true}
app.redis.startup-wait.max-wait=${REDIS_STARTUP_MAX_WAIT:120s}
app.redis.startup-wait.retry-interval=${REDIS_STARTUP_RETRY_INTERVAL:2s}

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.keyboard.mes.entity
mybatis.configuration.map-underscore-to-camel-case=true

server.port=8088

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
app.shiro.session-timeout-seconds=${SHIRO_SESSION_TIMEOUT_SECONDS:1800}
