server:
  port: 8088

spring:
  application:
    name: keyboard-mes
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:keyboard_mes}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000ms
  cache:
    type: redis

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.keyboard.mes.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
  redis:
    startup-wait:
      enabled: ${REDIS_STARTUP_WAIT_ENABLED:true}
      max-wait: ${REDIS_STARTUP_MAX_WAIT:120s}
      retry-interval: ${REDIS_STARTUP_RETRY_INTERVAL:2s}
  shiro:
    session-timeout-seconds: ${SHIRO_SESSION_TIMEOUT_SECONDS:1800}
