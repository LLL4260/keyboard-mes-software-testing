<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 34px "Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .sub{font:18px "Microsoft YaHei",Arial,sans-serif;fill:#475569}
      .head{font:700 20px "Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .txt{font:16px "Microsoft YaHei",Arial,sans-serif;fill:#334155}
      .small{font:14px "Microsoft YaHei",Arial,sans-serif;fill:#64748b}
      .step{fill:#ffffff;stroke:#334155;stroke-width:1.3}
      .decision{fill:#fef3c7;stroke:#92400e;stroke-width:1.3}
      .line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="52" y="62" class="title">Keyboard MES 当前生产业务主流程</text>
  <text x="52" y="94" class="sub">登录 → 工单 → 任务 → 报工 → 检验 → 返修 / 完成 → 追溯报表</text>

  <rect x="54" y="142" width="1492" height="604" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>

  <rect x="96" y="220" width="160" height="104" rx="14" class="step" fill="#eef2ff"/>
  <text x="126" y="258" class="head">用户登录</text>
  <text x="122" y="287" class="small">按岗位进入工作台</text>

  <rect x="326" y="220" width="190" height="104" rx="14" class="step" fill="#eff6ff"/>
  <text x="362" y="258" class="head">基础资料</text>
  <text x="356" y="287" class="small">产品 / 物料 / BOM / 工艺</text>

  <rect x="586" y="220" width="176" height="104" rx="14" class="step" fill="#eff6ff"/>
  <text x="624" y="258" class="head">生产工单</text>
  <text x="626" y="287" class="small">production_order</text>

  <polygon points="884,204 1002,272 884,340 766,272" class="decision"/>
  <text x="820" y="266" class="head">工艺可用?</text>
  <text x="829" y="292" class="small">按 sequence_no</text>

  <rect x="1048" y="220" width="184" height="104" rx="14" class="step" fill="#ecfdf5"/>
  <text x="1086" y="258" class="head">生成任务</text>
  <text x="1083" y="287" class="small">production_task</text>

  <rect x="1302" y="220" width="184" height="104" rx="14" class="step" fill="#ecfdf5"/>
  <text x="1340" y="258" class="head">现场报工</text>
  <text x="1335" y="287" class="small">work_report</text>

  <polygon points="1394,418 1510,486 1394,554 1278,486" class="decision"/>
  <text x="1334" y="480" class="head">检验合格?</text>
  <text x="1328" y="506" class="small">inspection_record</text>

  <rect x="1024" y="438" width="184" height="104" rx="14" class="step" fill="#fdf2f8"/>
  <text x="1062" y="476" class="head">返修处理</text>
  <text x="1055" y="505" class="small">repair / recheck</text>
  <text x="1052" y="528" class="small">通过后进入完成</text>

  <rect x="1302" y="636" width="184" height="104" rx="14" class="step" fill="#dcfce7"/>
  <text x="1342" y="674" class="head">状态完成</text>
  <text x="1334" y="703" class="small">刷新任务与工单</text>

  <rect x="580" y="636" width="240" height="104" rx="14" class="step" fill="#fefce8"/>
  <text x="646" y="674" class="head">追溯报表</text>
  <text x="619" y="703" class="small">trace / overview / quality</text>

  <line x1="256" y1="272" x2="326" y2="272" class="line"/>
  <line x1="516" y1="272" x2="586" y2="272" class="line"/>
  <line x1="762" y1="272" x2="766" y2="272" class="line"/>
  <line x1="1002" y1="272" x2="1048" y2="272" class="line"/>
  <line x1="1232" y1="272" x2="1302" y2="272" class="line"/>
  <line x1="1394" y1="324" x2="1394" y2="418" class="line"/>
  <line x1="1278" y1="486" x2="1208" y2="486" class="line"/>
  <line x1="1394" y1="554" x2="1394" y2="636" class="line"/>
  <line x1="1302" y1="688" x2="820" y2="688" class="line"/>

  <text x="1016" y="256" class="small">是</text>
  <text x="1225" y="468" class="small">不合格</text>
  <text x="1410" y="596" class="small">合格</text>
  <text x="80" y="795" class="txt">异常分支保留在下方，主流程保持单向推进，适合 PPT 讲解时逐步展开。</text>
</svg>
